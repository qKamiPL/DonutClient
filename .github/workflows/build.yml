
name: Build DonutClient

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Ustaw Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Zbuduj projekt
        run: gradle build

      - name: Udostępnij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutClient-JAR
          path: build/libs/*.jar
          if-no-files-found: error
